[package]
name = "anchor"
version = "0.29.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
anchor-lang = { version = "=0.29.0", features = ["allow-missing-optionals", "event-cpi", "init-if-needed"] }
anchor-spl = { version = "=0.29.0", features = ["governance", "memo", "metadata"] }
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
