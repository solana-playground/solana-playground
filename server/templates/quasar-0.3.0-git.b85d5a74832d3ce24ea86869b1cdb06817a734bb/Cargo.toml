[package]
name = "program"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[features]
debug = ["quasar-lang/debug"]
no-entrypoint = []

[dependencies]
quasar-lang = { git = "https://github.com/blueshift-gg/quasar", rev = "b85d5a74832d3ce24ea86869b1cdb06817a734bb" }
quasar-metadata = { git = "https://github.com/blueshift-gg/quasar", rev = "b85d5a74832d3ce24ea86869b1cdb06817a734bb" }
quasar-spl = { git = "https://github.com/blueshift-gg/quasar", rev = "b85d5a74832d3ce24ea86869b1cdb06817a734bb" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
