[package]
name = "anchor-idl-convert"
version = "0.1.0"
description = "Convert legacy IDLs to the new spec"
authors = ["Acheron <acheroncrypto@gmail.com>"]
repository = "https://github.com/solana-playground/solana-playground"
license = "GPL-3.0"
homepage = "https://beta.solpg.io"
edition = "2021"
keywords = ["anchor", "idl", "solana", "wasm"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anchor-lang-idl = { version = "0.1.4", features = ["convert"] }
serde_json = "*"
wasm-bindgen = "*"
